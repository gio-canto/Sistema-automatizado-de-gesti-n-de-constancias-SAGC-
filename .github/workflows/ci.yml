name: SAGC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify frontend and backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax and build frontend
        run: npm run check

      - name: Test SAGC identifiers
        run: |
          npm run folio:test
          npm run chain:test
          npm run token:test

      - name: Smoke test unified production server
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=3001 npm start > /tmp/sagc-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..15}; do
            if curl --silent --fail http://127.0.0.1:3001/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --silent --fail http://127.0.0.1:3001/api/health >/dev/null
          curl --silent --fail http://127.0.0.1:3001/ >/dev/null
          curl --silent --fail http://127.0.0.1:3001/ruta-spa-de-prueba >/dev/null

          API_404=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/ruta-inexistente)
          test "$API_404" = "404"
