name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-vite
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify Vite production bundle
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -q 'main.jsx' dist/index.html; then
            echo 'ERROR: dist/index.html todavía referencia main.jsx'
            exit 1
          fi
          grep -q '/Sistema-automatizado-de-gesti-n-de-constancias-SAGC-/assets/' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # El repositorio todavía tiene activo el Pages heredado por rama/Jekyll.
      # Ese despliegue suele terminar ~40-50 s después del push y puede pisar
      # el dist de Vite. Esperamos deliberadamente para publicar Vite al final.
      - name: Wait for legacy Pages deployment
        run: sleep 90

      - name: Deploy Vite bundle to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
