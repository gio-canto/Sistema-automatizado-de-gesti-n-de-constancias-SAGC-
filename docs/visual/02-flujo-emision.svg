<rect x="210" y="430" width="250" height="125" rx="18"/><rect x="510" y="430" width="250" height="125" rx="18"/><rect x="810" y="430" width="250" height="125" rx="18"/><rect x="1110" y="430" width="250" height="125" rx="18"/>
</g>
<g font-size="21" font-weight="700" fill="#202124" text-anchor="middle">
<text x="185" y="198">1 · Tipo de</text><text x="185" y="225">documento</text>
<text x="485" y="198">2 · Evento, textos</text><text x="485" y="225">y campos especiales</text>
<text x="785" y="198">3 · Tamaño y</text><text x="785" y="225">orientación</text>
<text x="1085" y="198">4 · Plantilla y</text><text x="1085" y="225">previsualización</text>
<text x="1385" y="198">5 · Captura manual</text><text x="1385" y="225">o carga masiva</text>
<text x="335" y="478">6 · Revisión y</text><text x="335" y="505">corrección de datos</text>
<text x="635" y="472" fill="#8a1538">7 · Folio + cadena</text><text x="635" y="501" fill="#8a1538">+ token único + QR</text>
<text x="935" y="478">8 · Generación y</text><text x="935" y="505">previsualización PDF</text>
<text x="1235" y="478">9 · Descarga</text><text x="1235" y="505">individual / ZIP</text>
</g>
<g font-size="15" fill="#697386" text-anchor="middle">
<text x="185" y="252">Constancia · diploma · etc.</text><text x="485" y="252">Markdown y variables</text><text x="785" y="252">Carta / personalizado</text><text x="1085" y="252">Base o reutilizable</text><text x="1385" y="252">Importación estructurada</text>
