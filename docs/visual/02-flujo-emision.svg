<defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8a1538"/></marker></defs>
<rect width="1600" height="760" fill="#ffffff"/>
<text x="800" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#202124">Flujo real propuesto para emitir constancias</text>
<text x="800" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#697386">Sintetizado a partir de las pantallas conceptuales del documento</text>
