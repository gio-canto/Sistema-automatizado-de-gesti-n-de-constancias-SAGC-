<text x="800" y="650" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700" fill="#137a46">Después de emitir: el registro permanece en la base de datos y el QR abre el validador público</text>
<text x="800" y="678" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" fill="#53606f">La emisión no termina en el PDF: debe existir trazabilidad, estado y posibilidad de validación.</text>
