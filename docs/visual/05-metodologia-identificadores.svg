<rect x="170" y="645" width="1260" height="125" rx="22" fill="#202124"/>
<text x="800" y="684" text-anchor="middle" font-size="20" font-weight="700" fill="white">Entregables obligatorios de esta metodología</text>
<text x="800" y="716" text-anchor="middle" font-size="16" fill="#d9dde3">Especificación de formato · pseudocódigo · casos de prueba · reglas de unicidad · versionado · amenazas · política de cancelación</text>
<text x="800" y="744" text-anchor="middle" font-size="16" fill="#d9dde3">La cadena de ejemplo del prototipo NO debe convertirse automáticamente en el estándar de producción.</text>
